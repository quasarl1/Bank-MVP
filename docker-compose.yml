name: systembank
services:
  redis:
    image: redis:alpine
    container_name: bank_redis
    ports:
      - "6379:6379"
    restart: always
  db:
    image: postgres:latest
    container_name: bank_db
    restart: always
    env_file:
      - Docker.env
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bank_api
    restart: always
    env_file:
      - Docker.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DB_HOST=db
      - REDIS_HOST=redis
    ports:
      - "8080:8080"
    depends_on:
      - db